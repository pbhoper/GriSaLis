services:
  postgres:
    image: postgres:16-alpine
    container_name: pc_shop_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: poiuytrewq123.com
      POSTGRES_DB: pc_shop_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pc_shop_db"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - pc_shop_net

  kafka:
    image: apache/kafka:3.8.0
    container_name: pc_shop_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: "4L62xD12T_aCH1KmA0sp1g"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - pc_shop_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pc_shop_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: poiuytrewq123.com
      DB_NAME: pc_shop_db
      KAFKA_BROKER: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - pc_shop_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pc_shop_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pc_shop_net

volumes:
  pgdata:
  kafka_data:

networks:
  pc_shop_net:
    driver: bridge